[project]
name = "vnmach"
version = "0.1.0"
description = "Self-replicating robot colony simulator for Mars, with AI planners"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.3"]
arm = ["mujoco>=3.0", "gymnasium>=1.0", "numpy"]
dev = ["pytest"]

[project.scripts]
vnmach = "vnmach.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vnmach", "vnmach.arm"]

[tool.setuptools.package-data]
"vnmach.arm" = ["weights/*.npz"]
